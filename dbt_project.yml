name: london_air
version: "1.0.0"
profile: london_air

model-paths: ["models"]
seed-paths: ["seeds"]
target-path: "target"

flags:
  send_anonymous_usage_stats: false

# Layers follow dbt's recommended structure:
#   staging      = one model per source table, renamed and typed only (the "bronze" layer)
#   intermediate = joins, cleaning and DAQI business logic; seeds come in here (the "silver" layer)
#   marts        = final tables for Tableau, one per grain; marts never read from other marts (the "gold" layer)
models:
  london_air:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

seeds:
  london_air:
    daqi_bands:
      +column_types:
        species_code: varchar
        daqi_index: integer
        band: varchar
        lower_bound_ugm3: integer
    daqi_advice:
      +column_types:
        band: varchar
        advice_at_risk: varchar
