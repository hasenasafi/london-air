id: london_air_pipeline
namespace: london.air
description: |
  Every hour: pull new hourly readings for the Merton monitoring sites (bronze),
  rebuild the cleaned data and DAQI alert tables with dbt (silver + gold),
  then export the gold tables to CSV for the Tableau dashboard.
  Data: London Air Quality Network, Environmental Research Group, Imperial College London.

# Never run two copies at once: if a run is still going, the new one is cancelled.
concurrency:
  limit: 1
  behavior: CANCEL

tasks:
  - id: run_pipeline
    type: io.kestra.plugin.scripts.shell.Commands
    # My own image with the tools pre-installed (see Dockerfile), so runs don't
    # depend on downloading packages from the internet each time.
    containerImage: london-air-pipeline:1
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: NEVER
      volumes:
        - /Users/hasenasafi/Documents/london-air:/project
    env:
      DBT_TARGET_PATH: /tmp/dbt_target
      DBT_LOG_PATH: /tmp/dbt_logs
    # A network blip (e.g. the laptop just woke up) gets two more tries.
    retry:
      type: constant
      interval: PT2M
      maxAttempts: 3
    commands:
      - cd /project
      - bash run_pipeline.sh

triggers:
  - id: every_hour
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 * * * *"
    timezone: Europe/London
