# How dbt connects to the database. No passwords needed: DuckDB is a local file.
london_air:
  target: dev
  outputs:
    dev:
      type: duckdb
      # The models dbt builds live in their own file. It can always be rebuilt with
      # `dbt build`, so it is NOT stored in git.
      path: data/warehouse.duckdb
      # The raw tables written by pipeline/extract_load.py, attached read-only
      # so dbt can never change the raw data.
      attach:
        - path: data/air_quality.duckdb
          alias: raw
          read_only: true
