# How dbt connects to the database. No passwords needed: DuckDB is a local file.
london_air:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Silver and gold are built in their own file. It can always be rebuilt with `dbt build`,
      # so it is NOT stored in git.
      path: data/warehouse.duckdb
      # Bronze (the history collected by the pipeline) is attached read-only,
      # so dbt can never change the raw data.
      attach:
        - path: data/air_quality.duckdb
          alias: bronze
          read_only: true
