version: 2

# BRONZE: the raw tables written by pipeline/extract_load.py, exactly as the API sent them.
sources:
  - name: bronze
    database: bronze
    schema: main
    tables:
      - name: raw_readings
        description: One row per site, pollutant and hour, as returned by the LAQN API.
        columns:
          - name: measured_at
            tests: [not_null]
      - name: raw_sites
        description: All London monitoring sites, refreshed on every run.
        columns:
          - name: site_code
            tests: [unique, not_null]
      - name: load_log
        description: One row per site and pollutant per pipeline run. Proof of what each run added.
